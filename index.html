<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HBD TO MAY - Python</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@800;900&family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Mitr', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1f0817;
    color: #fff;
}

/* Flash Screen Effect */
#flash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #ffe4e6;
    z-index: 2500;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
}

#flash-screen.flash {
    opacity: 1;
    transition: opacity 0.05s ease;
}

/* ================= INTRO SCREEN ================= */
#intro-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 999;
    background: radial-gradient(circle at center, #3b102b 0%, #1a0513 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transition: opacity 1s ease, visibility 1s ease;
}

#intro-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.intro-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
}

.countdown-number {
    font-size: 100px;
    font-weight: 800;
    background: linear-gradient(45deg, #ff758f, #ffb3c1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255, 117, 143, 0.6);
    animation: pulseText 1s infinite alternate;
}

.hbd-title {
    font-size: 40px;
    font-weight: 800;
    background: linear-gradient(45deg, #ff4d6d, #ff85a1, #f472b6, #fbcfe8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.hbd-subtitle {
    font-size: 18px;
    color: #fbcfe8;
    margin-bottom: 30px;
    opacity: 0;
    transition: opacity 1s ease 0.3s;
}

.enter-btn {
    padding: 14px 36px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(45deg, #ff4d6d, #ff758f, #f43f5e);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 77, 109, 0.7);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease 0.5s;
}

.enter-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 77, 109, 0.9);
}

.show-element {
    opacity: 1 !important;
    transform: scale(1) translateY(0) !important;
}

@keyframes pulseText {
    0% { transform: scale(0.95); }
    100% { transform: scale(1.05); }
}

/* ================= MAIN CONTAINER ================= */
.container {
    width: 100%;
    height: 100vh;
    display: grid;
    grid-template-columns: 55% 45%;
    opacity: 0;
    transition: opacity 1s ease;
}

.left {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #15040f;
    overflow: hidden;
}

canvas#main-canvas {
    position: absolute;
    width: 100%;
    height: 100%;
}

.left::before {
    content: "";
    position: absolute;
    width: 480px;
    height: 480px;
    background: radial-gradient(circle, rgba(255,117,143,0.4) 0%, rgba(251,207,232,0.2) 50%, transparent 70%);
    filter: blur(85px);
    animation: auraPulse 3s infinite alternate ease-in-out;
}

@keyframes auraPulse {
    0% { transform: scale(0.8); opacity: 0.5; }
    100% { transform: scale(1.25); opacity: 0.9; }
}

/* Next Wish Button */
.wish-btn {
    position: absolute;
    bottom: 30px;
    z-index: 10;
    padding: 12px 28px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(45deg, #ff4d6d, #f472b6);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 77, 109, 0.7);
    opacity: 0;
    transform: translateY(20px) scale(0.9);
    pointer-events: none;
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.wish-btn.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
    animation: floatBtn 2s infinite alternate ease-in-out;
}

.wish-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(244, 114, 182, 0.9);
}

@keyframes floatBtn {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
}

/* Right Section */
.right {
    background: #230919;
    color: #fff;
    padding: 30px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid rgba(251, 207, 232, 0.2);
    box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    overflow: hidden;
}

.right h2 {
    margin-bottom: 15px;
    font-size: 24px;
    font-weight: 600;
    color: #ff85a1;
    text-shadow: 0 0 12px rgba(255, 133, 161, 0.5);
    display: flex;
    align-items: center;
    gap: 10px;
}

.codebox {
    flex: 1;
    background: #2d0d21;
    border-radius: 16px;
    padding: 20px;
    font-family: 'Fira Code', monospace;
    font-size: 13.5px;
    line-height: 1.6;
    color: #fce7f3;
    white-space: pre-wrap;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
    border: 1px solid rgba(251, 207, 232, 0.15);
    overflow-y: auto;
}

/* Syntax Highlighting */
.codebox .kwd { color: #f43f5e; font-weight: 600; }
.codebox .imp { color: #fb7185; }
.codebox .fn  { color: #ff85a1; }
.codebox .str { color: #fef08a; }
.codebox .num { color: #f9a8d4; }
.codebox .com { color: #fda4af; font-style: italic; opacity: 0.85; }

.codebox::-webkit-scrollbar { width: 6px; }
.codebox::-webkit-scrollbar-thumb { background: rgba(251, 207, 232, 0.3); border-radius: 4px; }

/* ================= WISH MODAL OVERLAY ================= */
.wish-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1000;
    background: rgba(26, 5, 19, 0.88);
    backdrop-filter: blur(12px);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    transition: all 0.5s ease;
}

.wish-modal.active {
    opacity: 1;
    visibility: visible;
}

.wish-card {
    background: linear-gradient(135deg, rgba(255,117,143,0.25), rgba(244,114,182,0.25));
    border: 1px solid rgba(251, 207, 232, 0.4);
    box-shadow: 0 0 45px rgba(255, 77, 109, 0.45);
    border-radius: 28px;
    padding: 35px 30px;
    max-width: 520px;
    width: 100%;
    text-align: center;
    position: relative;
    transform: scale(0.8) translateY(30px);
    transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.wish-modal.active .wish-card {
    transform: scale(1) translateY(0);
}

.wish-card h3 {
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(45deg, #ff4d6d, #ff85a1, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 20px;
}

.wish-card p {
    font-size: 17px;
    line-height: 1.8;
    color: #fff0f5;
    margin-bottom: 25px;
    font-weight: 400;
    word-break: break-word;
}

.close-modal-btn {
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(45deg, #ff4d6d, #f472b6);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 77, 109, 0.6);
    transition: all 0.3s ease;
}

.close-modal-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(244, 114, 182, 0.8);
}

/* ================= FULLSCREEN PHOTO GALLERY ================= */
.gallery-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2000;
    background: #1f0817;
    opacity: 0;
    visibility: hidden;
    overflow-y: auto;
    scroll-behavior: smooth;
    transition: all 0.5s ease;
}

.gallery-modal.active {
    opacity: 1;
    visibility: visible;
}

.gallery-close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 2100;
    background: rgba(35, 9, 25, 0.8);
    border: 1px solid rgba(251, 207, 232, 0.4);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
    transition: all 0.3s ease;
}

.gallery-close-btn:hover {
    background: rgba(255, 77, 109, 0.8);
    transform: rotate(90deg);
}

/* SECTION 1: FULL SCREEN PHONE IMAGE HERO */
.hero-fullscreen {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #15040f;
    overflow: hidden;
}

.main-photo-card {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.main-photo-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: drop-shadow(0 0 20px rgba(255,117,143,0.4));
}

/* Surprise Shock Animation */
.surprise-anim {
    animation: surpriseShock 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

@keyframes surpriseShock {
    0% { transform: scale(0.1) rotate(-10deg); opacity: 0; filter: brightness(3) blur(10px); }
    50% { transform: scale(1.12) rotate(3deg); opacity: 1; filter: brightness(1.5) blur(0); }
    75% { transform: scale(0.96) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
}

/* Scroll Hint Bar */
.scroll-hint {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: #fff;
    background: rgba(35, 9, 25, 0.8);
    padding: 10px 22px;
    border-radius: 30px;
    border: 1px solid rgba(255, 133, 161, 0.5);
    box-shadow: 0 0 20px rgba(255, 77, 109, 0.4);
    backdrop-filter: blur(8px);
    z-index: 10;
    animation: bounceHint 1.8s infinite ease-in-out;
    pointer-events: none;
}

.scroll-hint span {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #ff85a1;
    text-shadow: 0 0 8px rgba(255, 133, 161, 0.6);
}

.scroll-hint .arrow {
    font-size: 18px;
    color: #f472b6;
}

@keyframes bounceHint {
    0%, 100% { transform: translate(-50%, 0); }
    50% { transform: translate(-50%, 12px); }
}

/* SECTION 2: SUB PHOTOS GRID */
.sub-photos-section {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 60px 20px;
}

.sub-photos-title {
    font-size: 22px;
    font-weight: 700;
    color: #ff85a1;
    margin-bottom: 20px;
    text-align: center;
    text-shadow: 0 0 10px rgba(255, 133, 161, 0.5);
}

.sub-photos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 15px;
}

.sub-photo-item {
    aspect-ratio: 1;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid rgba(251, 207, 232, 0.25);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: #2d0d21;
}

.sub-photo-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.sub-photo-item:hover {
    transform: translateY(-6px) scale(1.03);
    border-color: #ff758f;
    box-shadow: 0 0 20px rgba(255, 117, 143, 0.7);
}

.sub-photo-item.active {
    border-color: #f472b6;
    box-shadow: 0 0 22px rgba(244, 114, 182, 0.85);
}

/* Responsive Mobile Layout */
@media (max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
        grid-template-rows: 52vh 48vh;
    }
    .left { height: 100%; }
    .right { height: 100%; padding: 15px; }
    .codebox { font-size: 11px; padding: 12px; }
    .hbd-title { font-size: 30px; }
    .countdown-number { font-size: 75px; }
    .wish-btn { bottom: 15px; padding: 10px 22px; font-size: 14px; }
    .wish-card { padding: 25px 20px; }
    .wish-card h3 { font-size: 22px; }
    .wish-card p { font-size: 15px; }
    .scroll-hint span { font-size: 12px; }
    .sub-photos-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
}
</style>
</head>

<body>

<!-- FLASH SCREEN EFFECT FOR SURPRISE -->
<div id="flash-screen"></div>

<!-- INTRO COUNTDOWN SCREEN -->
<div id="intro-screen">
    <canvas id="intro-canvas"></canvas>
    <div class="intro-content">
        <div id="cd-number" class="countdown-number">5</div>
        <h1 id="hbd-title" class="hbd-title">🎂 HAPPY BIRTHDAY! 💖</h1>
        <p id="hbd-sub" class="hbd-subtitle">สุขสันต์วันเกิดนะลูกพ่อเตื๊อกแม่จันทร์✨</p>
        <button id="enter-btn" class="enter-btn" onclick="startApp()">เปิดของขวัญจากชายภู 🎀</button>
    </div>
</div>

<!-- MAIN PAGE -->
<div class="container" id="main-container">
    <div class="left">
        <canvas id="main-canvas"></canvas>
        <button id="wish-btn" class="wish-btn" onclick="openWishModal()">คลิกเพื่ออ่าน 💌</button>
    </div>
    <div class="right">
        <h2><span>💖</span>  Python </h2>
        <div class="codebox" id="code"></div>
    </div>
</div>

<!-- BIRTHDAY WISH MODAL -->
<div id="wish-modal" class="wish-modal">
    <div class="wish-card">
        <h3>✨ Special Birthday Wish ✨</h3>
        <p>สุขสันต์วันเกิดคั้บเมย์<br>
           ขอให้เมย์มีความสุขมากๆนะเพื่อน<br>
           ขอให้ติดมหาลับในอีกไม่กี่เดือนข้างหน้า<br>
           ขอให้มีอนาคตดีๆนะ<br>
           happy birthday ค้าบบบกรวิภา 🎓🎉💖</p>
        <button class="close-modal-btn" onclick="closeWishModal()">ปิดเพื่อเปิด 📸</button>
    </div>
</div>

<!-- FULLSCREEN PHOTO GALLERY -->
<div id="gallery-modal" class="gallery-modal">
    <button class="gallery-close-btn" onclick="closeGalleryModal()">✕</button>

    <!-- Section 1: Fullscreen Phone Image -->
    <div class="hero-fullscreen">
        <div class="main-photo-card" id="main-photo-card">
            <img id="main-featured-img" src="images/1.jpg" alt="Memory 1">
        </div>
        <div class="scroll-hint">
            <span>👇 เลื่อนลงข้างล่าง ✨</span>
            <div class="arrow">▼</div>
        </div>
    </div>

    <!-- Section 2: Sub Photos Grid -->
    <div class="sub-photos-section">
        <div class="sub-photos-title">📸 รูปหลุดกรวิภาาาาาาาา 💖</div>
        <div class="sub-photos-grid">
            <div class="sub-photo-item active" onclick="changeMainPhoto('images/1.jpg', this)">
                <img src="images/1.jpg" alt="Photo 1">
            </div>
            <div class="sub-photo-item" onclick="changeMainPhoto('images/2.jpg', this)">
                <img src="images/2.jpg" alt="Photo 2">
            </div>
            <div class="sub-photo-item" onclick="changeMainPhoto('images/3.jpg', this)">
                <img src="images/3.jpg" alt="Photo 3">
            </div>
            <div class="sub-photo-item" onclick="changeMainPhoto('images/4.jpg', this)">
                <img src="images/4.jpg" alt="Photo 4">
            </div>
            <div class="sub-photo-item" onclick="changeMainPhoto('images/5.jpg', this)">
                <img src="images/5.jpg" alt="Photo 5">
            </div>
        </div>
    </div>
</div>

<script>
/* ================= 1. COUNTDOWN & INTRO ================= */
let count = 5;
const cdNum = document.getElementById("cd-number");
const hbdTitle = document.getElementById("hbd-title");
const hbdSub = document.getElementById("hbd-sub");
const enterBtn = document.getElementById("enter-btn");

const timer = setInterval(() => {
    count--;
    if(count > 0) {
        cdNum.innerText = count;
    } else {
        clearInterval(timer);
        cdNum.style.display = "none";
        hbdTitle.classList.add("show-element");
        hbdSub.classList.add("show-element");
        enterBtn.classList.add("show-element");
        createIntroFireworks();
    }
}, 1000);

function startApp() {
    const introScreen = document.getElementById("intro-screen");
    const mainContainer = document.getElementById("main-container");
    
    introScreen.style.opacity = "0";
    introScreen.style.visibility = "hidden";
    mainContainer.style.opacity = "1";
    
    initMainCanvas();
    typeCode();
}

/* ================= 2. PYTHON SYNTAX TYPEWRITER ================= */
const rawPythonCode = `import turtle
import math
import random

# Sweet Birthday Heart for MAY 💖
screen = turtle.Screen()
screen.bgcolor("#15040f")

t = turtle.Turtle()
t.speed(0)
t.hideturtle()

colors = ["#ff4d6d", "#ff758f", "#ff85a1", "#f472b6", "#fbcfe8", "#ffffff"]

# Drawing Heart Curve Step-by-Step
for i in range(360):
    angle = math.radians(i)
    x = 16 * math.sin(angle)**3
    y = 13*math.cos(angle) - 5*math.cos(2*angle) - 2*math.cos(3*angle) - math.cos(4*angle)
    
    t.penup()
    t.goto(x * 18, y * 18)
    t.pendown()
    t.color(random.choice(colors))
    
    for j in range(8):
        t.forward(5)
        t.backward(5)
        t.right(45)

# Write Big Animated Text
t.penup()
t.goto(0, 0)
t.color("#ff758f")
t.write("HBD TO MAY", align="center", font=("Poppins", 24, "bold"))

turtle.done()`;

function highlightSyntax(text) {
    let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    return html
        .replace(/(#.*)/g, '<span class="com">$1</span>')
        .replace(/(".*?"|'.*? ')/g, '<span class="str">$1</span>')
        .replace(/\b(import|for|in|range|def|return)\b/g, '<span class="kwd">$1</span>')
        .replace(/\b(turtle|math|random)\b/g, '<span class="imp">$1</span>')
        .replace(/\b(Screen|Turtle|bgcolor|speed|hideturtle|radians|sin|cos|penup|goto|pendown|color|choice|forward|backward|right|write|done)\b(?=\()/g, '<span class="fn">$1</span>')
        .replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
}

let codeIdx = 0;
function typeCode() {
    const box = document.getElementById("code");
    if (codeIdx < rawPythonCode.length) {
        codeIdx++;
        box.innerHTML = highlightSyntax(rawPythonCode.slice(0, codeIdx));
        box.scrollTop = box.scrollHeight;
        setTimeout(typeCode, 15);
    }
}

/* ================= 3. INTRO FIREWORKS ================= */
const introCanvas = document.getElementById("intro-canvas");
const iCtx = introCanvas.getContext("2d");
let introParticles = [];

function resizeIntro() {
    introCanvas.width = window.innerWidth;
    introCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeIntro);
resizeIntro();

function createIntroFireworks() {
    for (let i = 0; i < 160; i++) {
        introParticles.push({
            x: introCanvas.width / 2,
            y: introCanvas.height / 2,
            vx: (Math.random() - 0.5) * 14,
            vy: (Math.random() - 0.5) * 14,
            size: Math.random() * 4 + 1,
            color: `hsl(${320 + Math.random() * 50}, 100%, 75%)`,
            alpha: 1
        });
    }
    animateIntro();
}

function animateIntro() {
    if (document.getElementById("intro-screen").style.visibility === "hidden") return;
    iCtx.fillStyle = "rgba(26, 5, 19, 0.2)";
    iCtx.fillRect(0, 0, introCanvas.width, introCanvas.height);

    introParticles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.008;
        iCtx.beginPath();
        iCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        iCtx.fillStyle = p.color;
        iCtx.globalAlpha = Math.max(0, p.alpha);
        iCtx.fill();
        if (p.alpha <= 0) introParticles.splice(idx, 1);
    });
    iCtx.globalAlpha = 1;
    requestAnimationFrame(animateIntro);
}

/* ================= 4. GRAND HEART & LETTER-BY-LETTER TEXT ================= */
let canvas, ctx;
let heartParticles = [];
let drawnCount = 0;
let bgStars = [];
let bursts = [];
const TOTAL_PARTICLES = 450;

const fullText = "HBD TO MAY";
let textCharIndex = 0;
let textFrameTimer = 0;
let wishBtnTriggered = false;

function getHeartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x, y };
}

class HeartStar {
    constructor(t) {
        this.t = t;
        this.color = `hsl(${320 + (t / (Math.PI * 2)) * 50}, 100%, 75%)`;
        this.size = 1.8 + Math.random() * 2;
    }

    draw(scale, beatScale) {
        const p = getHeartPoint(this.t);
        const finalScale = scale * beatScale;
        const x = canvas.width / 2 + p.x * finalScale;
        const y = canvas.height / 2 - p.y * finalScale;

        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.2;

        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            const a = (i * Math.PI) / 2;
            ctx.lineTo(x + Math.cos(a) * this.size * 3.5, y + Math.sin(a) * this.size * 3.5);
            ctx.stroke();
        }
    }
}

function initMainCanvas() {
    canvas = document.getElementById("main-canvas");
    ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    heartParticles = [];
    for (let i = 0; i < TOTAL_PARTICLES; i++) {
        const t = (i / TOTAL_PARTICLES) * Math.PI * 2;
        heartParticles.push(new HeartStar(t));
    }
    drawnCount = 0;
    textCharIndex = 0;

    bgStars = [];
    for (let i = 0; i < 150; i++) {
        bgStars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 1.5,
            a: Math.random(),
            s: Math.random() * 0.3 + 0.1
        });
    }

    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        createBurst(e.clientX - rect.left, e.clientY - rect.top);
    });

    animateMain();
}

function createBurst(x, y) {
    for (let i = 0; i < 35; i++) {
        bursts.push({
            x, y,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            life: 1,
            color: `hsl(${320 + Math.random() * 50}, 100%, 75%)`
        });
    }
}

let tick = 0;
function animateMain() {
    tick += 0.035;
    const beatScale = 1 + Math.sin(tick) * 0.05;

    ctx.fillStyle = "rgba(21, 4, 15, 0.18)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#fff";
    for (let s of bgStars) {
        ctx.beginPath();
        ctx.globalAlpha = s.a;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.s;
        if (s.y > canvas.height) s.y = 0;
    }
    ctx.globalAlpha = 1;

    const baseScale = Math.min(canvas.width, canvas.height) / 42;

    if (drawnCount < TOTAL_PARTICLES) {
        drawnCount += 2;
    }

    const limit = Math.min(drawnCount, TOTAL_PARTICLES);
    for (let i = 0; i < limit; i++) {
        const p = heartParticles[i];
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        p.draw(baseScale, beatScale);
    }

    textFrameTimer++;
    if (textFrameTimer % 14 === 0 && textCharIndex < fullText.length) {
        textCharIndex++;
        createBurst(canvas.width / 2, canvas.height / 2);
    }

    if (textCharIndex >= fullText.length && !wishBtnTriggered) {
        wishBtnTriggered = true;
        setTimeout(() => {
            document.getElementById("wish-btn").classList.add("show");
        }, 600);
    }

    drawGrandCenterText(baseScale, beatScale);

    bursts.forEach((b, idx) => {
        b.x += b.vx;
        b.y += b.vy;
        b.life -= 0.025;
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = b.color;
        ctx.globalAlpha = Math.max(0, b.life);
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.8, 0, Math.PI * 2);
        ctx.fill();
        if (b.life <= 0) bursts.splice(idx, 1);
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(animateMain);
}

function drawGrandCenterText(scale, beatScale) {
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const fontSize = Math.max(22, Math.floor(scale * 2.1 * beatScale));
    ctx.font = `900 ${fontSize}px 'Poppins', 'Mitr', sans-serif`;

    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    const visibleText = fullText.slice(0, textCharIndex);

    const textGradient = ctx.createLinearGradient(cx - 150, 0, cx + 150, 0);
    textGradient.addColorStop(0, "#ff4d6d");
    textGradient.addColorStop(0.5, "#ff85a1");
    textGradient.addColorStop(1, "#f472b6");

    ctx.shadowBlur = 35;
    ctx.shadowColor = "#ff4d6d";
    ctx.fillStyle = textGradient;
    ctx.fillText(visibleText, cx, cy);

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#f472b6";
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#ffffff";
    ctx.strokeText(visibleText, cx, cy);

    ctx.shadowBlur = 5;
    ctx.shadowColor = "#ffffff";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(visibleText, cx, cy);

    ctx.restore();
}

/* ================= 5. MODAL & GALLERY WITH SURPRISE EFFECT ================= */
function openWishModal() {
    document.getElementById("wish-modal").classList.add("active");
    createBurst(window.innerWidth / 2, window.innerHeight / 2);
}

function closeWishModal() {
    document.getElementById("wish-modal").classList.remove("active");

    setTimeout(() => {
        const gallery = document.getElementById("gallery-modal");
        const card = document.getElementById("main-photo-card");
        const flash = document.getElementById("flash-screen");

        // 1. Open Gallery Screen
        gallery.classList.add("active");
        gallery.scrollTop = 0;

        // 2. Camera Flash Surprise Effect
        flash.classList.add("flash");
        setTimeout(() => flash.classList.remove("flash"), 120);

        // 3. Shock Pop Animation on Image
        card.classList.remove("surprise-anim");
        void card.offsetWidth; // Trigger reflow
        card.classList.add("surprise-anim");

        // 4. Multiple Confetti/Fireworks Explosions
        for (let i = 0; i < 6; i++) {
            setTimeout(() => {
                createBurst(
                    Math.random() * window.innerWidth,
                    Math.random() * window.innerHeight
                );
            }, i * 120);
        }
    }, 250);
}

function closeGalleryModal() {
    document.getElementById("gallery-modal").classList.remove("active");
}

function changeMainPhoto(primarySrc, element) {
    const mainImg = document.getElementById("main-featured-img");
    const card = document.getElementById("main-photo-card");

    mainImg.src = primarySrc;

    // Re-trigger animation effect on change
    card.classList.remove("surprise-anim");
    void card.offsetWidth;
    card.classList.add("surprise-anim");

    // Scroll smoothly back to hero image top
    document.getElementById("gallery-modal").scrollTo({ top: 0, behavior: 'smooth' });

    // Highlight active thumbnail
    document.querySelectorAll(".sub-photo-item").forEach(item => item.classList.remove("active"));
    if (element) {
        element.classList.add("active");
    }
}
