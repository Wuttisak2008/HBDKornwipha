<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday & Python Heart</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@300;400;600;800&family=Mitr:wght@400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', 'Mitr', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050508;
    color: #fff;
}

/* ================= INTRO OVERLAY ================= */
#intro-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 999;
    background: radial-gradient(circle at center, #1a0022 0%, #050508 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    transition: opacity 1s ease, visibility 1s ease;
}

#intro-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.intro-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
}

.countdown-number {
    font-size: 100px;
    font-weight: 800;
    background: linear-gradient(45deg, #ff007f, #00f0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
    animation: pulseText 1s infinite alternate;
}

.hbd-title {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(45deg, #ff007f, #ffeb3b, #00e5ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
}

.hbd-subtitle {
    font-size: 18px;
    color: #d1d5db;
    margin-bottom: 30px;
    opacity: 0;
    transition: opacity 1s ease 0.3s;
}

.enter-btn {
    padding: 14px 36px;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(45deg, #ff007f, #7928ca);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255, 0, 127, 0.6);
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.5s ease 0.5s;
}

.enter-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(255, 0, 127, 0.9);
}

.show-element {
    opacity: 1 !important;
    transform: scale(1) translateY(0) !important;
}

@keyframes pulseText {
    0% { transform: scale(0.95); }
    100% { transform: scale(1.05); }
}

/* ================= MAIN CONTAINER ================= */
.container {
    width: 100%;
    height: 100vh;
    display: grid;
    grid-template-columns: 55% 45%;
    opacity: 0;
    transition: opacity 1s ease;
}

/* Left Canvas */
.left {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000;
    overflow: hidden;
}

canvas#main-canvas {
    position: absolute;
    width: 100%;
    height: 100%;
}

.left::before {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(255,0,120,0.3) 0%, rgba(0,240,255,0.15) 50%, transparent 70%);
    filter: blur(80px);
    animation: auraPulse 3s infinite alternate ease-in-out;
}

@keyframes auraPulse {
    0% { transform: scale(0.8); opacity: 0.5; }
    100% { transform: scale(1.25); opacity: 0.9; }
}

/* Right Code Box */
.right {
    background: #0d0e15;
    color: #fff;
    padding: 30px;
    display: flex;
    flex-direction: column;
    border-left: 1px solid rgba(255,255,255,0.08);
    box-shadow: -10px 0 30px rgba(0,0,0,0.5);
    overflow: hidden;
}

.right h2 {
    margin-bottom: 15px;
    font-size: 24px;
    font-weight: 600;
    color: #00f0ff;
    text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
    display: flex;
    align-items: center;
    gap: 10px;
}

.codebox {
    flex: 1;
    background: #13141f;
    border-radius: 12px;
    padding: 20px;
    font-family: 'Fira Code', monospace;
    font-size: 13.5px;
    line-height: 1.6;
    color: #a9b7c6;
    white-space: pre-wrap;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
    overflow-y: auto;
}

/* Code Syntax Colors (VS Code Dark Style) */
.codebox .kwd { color: #ff79c6; font-weight: 600; } /* Keywords: import, for, in */
.codebox .imp { color: #bd93f9; }                   /* Modules/Lib */
.codebox .fn  { color: #50fa7b; }                   /* Functions */
.codebox .str { color: #f1fa8c; }                   /* Strings */
.codebox .num { color: #ffb86c; }                   /* Numbers */
.codebox .op  { color: #ff79c6; }                   /* Operators */
.codebox .com { color: #6272a4; font-style: italic; } /* Comments */

/* Custom Scrollbar */
.codebox::-webkit-scrollbar { width: 6px; }
.codebox::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }

/* Responsive Mobile Layout */
@media (max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
        grid-template-rows: 50vh 50vh;
    }
    
    .left { height: 100%; }
    .right { height: 100%; padding: 15px; }
    .codebox { font-size: 11.5px; padding: 12px; }
    .hbd-title { font-size: 32px; }
    .countdown-number { font-size: 80px; }
}
</style>
</head>

<body>

<!-- INTRO COUNTDOWN & HBD OVERLAY -->
<div id="intro-screen">
    <canvas id="intro-canvas"></canvas>
    <div class="intro-content">
        <div id="cd-number" class="countdown-number">5</div>
        <h1 id="hbd-title" class="hbd-title">🎉 HAPPY BIRTHDAY! 🎂</h1>
        <p id="hbd-sub" class="hbd-subtitle">ขอให้มีความสุขมากๆ สุขภาพแข็งแรงนะครับ ✨</p>
        <button id="enter-btn" class="enter-btn" onclick="startApp()">เปิดของขวัญ 💖</button>
    </div>
</div>

<!-- MAIN PAGE -->
<div class="container" id="main-container">
    <div class="left">
        <canvas id="main-canvas"></canvas>
    </div>
    <div class="right">
        <h2><span>⚡</span> Python Heart Code</h2>
        <div class="codebox" id="code"></div>
    </div>
</div>

<script>
/* ================= 1. COUNTDOWN & INTRO SYSTEM ================= */
let count = 5;
const cdNum = document.getElementById("cd-number");
const hbdTitle = document.getElementById("hbd-title");
const hbdSub = document.getElementById("hbd-sub");
const enterBtn = document.getElementById("enter-btn");

const timer = setInterval(() => {
    count--;
    if(count > 0) {
        cdNum.innerText = count;
    } else {
        clearInterval(timer);
        cdNum.style.display = "none";
        hbdTitle.classList.add("show-element");
        hbdSub.classList.add("show-element");
        enterBtn.classList.add("show-element");
        createIntroFireworks();
    }
}, 1000);

function startApp() {
    const introScreen = document.getElementById("intro-screen");
    const mainContainer = document.getElementById("main-container");
    
    introScreen.style.opacity = "0";
    introScreen.style.visibility = "hidden";
    mainContainer.style.opacity = "1";
    
    // Start heart animation & syntax typewriter
    initMainCanvas();
    typeCode();
}

/* ================= 2. SYNTAX HIGHLIGHTED TYPEWRITER ================= */
const rawPythonCode = `import turtle
import math
import random

# Initializing screen
screen = turtle.Screen()
screen.bgcolor("black")

t = turtle.Turtle()
t.speed(0)
t.hideturtle()

colors = ["red", "magenta", "cyan", "white"]

# Drawing Heart Curve
for i in range(360):
    angle = math.radians(i)
    x = 16 * math.sin(angle)**3
    y = 13*math.cos(angle) - 5*math.cos(2*angle) - 2*math.cos(3*angle) - math.cos(4*angle)
    
    t.penup()
    t.goto(x * 18, y * 18)
    t.pendown()
    t.color(random.choice(colors))
    
    for j in range(8):
        t.forward(6)
        t.backward(6)
        t.right(45)

turtle.done()`;

function highlightSyntax(text) {
    let html = text
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // Syntax regex matching
    return html
        .replace(/(#.*)/g, '<span class="com">$1</span>')
        .replace(/(".*?"|'.*? ')/g, '<span class="str">$1</span>')
        .replace(/\b(import|for|in|range|def|return)\b/g, '<span class="kwd">$1</span>')
        .replace(/\b(turtle|math|random)\b/g, '<span class="imp">$1</span>')
        .replace(/\b(Screen|Turtle|bgcolor|speed|hideturtle|radians|sin|cos|penup|goto|pendown|color|choice|forward|backward|right|done)\b(?=\()/g, '<span class="fn">$1</span>')
        .replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
}

let codeIdx = 0;
function typeCode() {
    const box = document.getElementById("code");
    if (codeIdx < rawPythonCode.length) {
        codeIdx++;
        const currentSlice = rawPythonCode.slice(0, codeIdx);
        box.innerHTML = highlightSyntax(currentSlice);
        box.scrollTop = box.scrollHeight;
        setTimeout(typeCode, 15);
    }
}

/* ================= 3. INTRO FIREWORKS CANVAS ================= */
const introCanvas = document.getElementById("intro-canvas");
const iCtx = introCanvas.getContext("2d");
let introParticles = [];

function resizeIntro() {
    introCanvas.width = window.innerWidth;
    introCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeIntro);
resizeIntro();

function createIntroFireworks() {
    for (let i = 0; i < 150; i++) {
        introParticles.push({
            x: introCanvas.width / 2,
            y: introCanvas.height / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 0.5) * 12,
            size: Math.random() * 4 + 1,
            color: `hsl(${Math.random() * 360}, 100%, 65%)`,
            alpha: 1
        });
    }
    animateIntro();
}

function animateIntro() {
    if (document.getElementById("intro-screen").style.visibility === "hidden") return;
    iCtx.fillStyle = "rgba(5, 5, 8, 0.2)";
    iCtx.fillRect(0, 0, introCanvas.width, introCanvas.height);

    introParticles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.008;
        iCtx.beginPath();
        iCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        iCtx.fillStyle = p.color;
        iCtx.globalAlpha = Math.max(0, p.alpha);
        iCtx.fill();
        if (p.alpha <= 0) introParticles.splice(idx, 1);
    });
    iCtx.globalAlpha = 1;
    requestAnimationFrame(animateIntro);
}

/* ================= 4. GRAND HEART CANVAS ANIMATION ================= */
let canvas, ctx;
let particles = [];
let bgStars = [];

function getHeartPoint(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return { x, y };
}

class HeartParticle {
    constructor() {
        this.t = Math.random() * Math.PI * 2;
        this.speed = 0.002 + Math.random() * 0.002;
        this.color = `hsl(${Math.random() * 60 + 320}, 100%, 65%)`; // Pink to cyan hues
        this.size = 1.5 + Math.random() * 2.5;
    }

    update() {
        this.t += this.speed;
        if (this.t > Math.PI * 2) {
            this.t = 0;
            this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
        }
    }

    draw(scale, beatScale) {
        const p = getHeartPoint(this.t);
        const finalScale = scale * beatScale;
        const x = canvas.width / 2 + p.x * finalScale;
        const y = canvas.height / 2 - p.y * finalScale;

        ctx.strokeStyle = this.color;
        ctx.lineWidth = 1.2;

        // Sparkle Star Shape
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            const a = (i * Math.PI) / 2;
            ctx.lineTo(x + Math.cos(a) * this.size * 4, y + Math.sin(a) * this.size * 4);
            ctx.stroke();
        }
    }
}

function initMainCanvas() {
    canvas = document.getElementById("main-canvas");
    ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Create Heart Particles
    particles = [];
    for (let i = 0; i < 350; i++) {
        particles.push(new HeartParticle());
    }

    // Floating background stars
    bgStars = [];
    for (let i = 0; i < 150; i++) {
        bgStars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 1.5,
            a: Math.random(),
            s: Math.random() * 0.3 + 0.1
        });
    }

    // Touch/Click burst interactivity
    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        createBurst(e.clientX - rect.left, e.clientY - rect.top);
    });

    animateMain();
}

let bursts = [];
function createBurst(x, y) {
    for (let i = 0; i < 25; i++) {
        bursts.push({
            x, y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1,
            color: `hsl(${Math.random() * 360}, 100%, 70%)`
        });
    }
}

let tick = 0;
function animateMain() {
    tick += 0.03;
    // Heartbeat scale oscillation
    const beatScale = 1 + Math.sin(tick) * 0.06;

    ctx.fillStyle = "rgba(0, 0, 0, 0.18)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw background stars
    ctx.fillStyle = "#fff";
    for (let s of bgStars) {
        ctx.beginPath();
        ctx.globalAlpha = s.a;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
        s.y += s.s;
        if (s.y > canvas.height) s.y = 0;
    }
    ctx.globalAlpha = 1;

    // Dynamic scale base on screen size
    const baseScale = Math.min(canvas.width, canvas.height) / 40;

    // Draw Heart Particles
    for (let p of particles) {
        p.update();
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        p.draw(baseScale, beatScale);
    }

    // Click Explosions
    bursts.forEach((b, idx) => {
        b.x += b.vx;
        b.y += b.vy;
        b.life -= 0.02;
        ctx.fillStyle = b.color;
        ctx.globalAlpha = Math.max(0, b.life);
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        if (b.life <= 0) bursts.splice(idx, 1);
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(animateMain);
}
</script>
</body>
</html>
